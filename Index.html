<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trading Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1128;--bg2:#161b3d;--line:#2a3166;--tx:#eef0ff;--mut:#8f97c9;--gold:#f5b94a;--mint:#3ddbb0;--red:#ff5d7a;color-scheme:dark;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font:15px/1.5 Onest,system-ui,sans-serif}
body{max-width:520px;margin:0 auto;padding:16px 16px 96px}
h1,h2,h3{font-family:Unbounded,Onest,sans-serif;font-weight:700;line-height:1.2}
.hero{position:relative;overflow:hidden;border-radius:24px;padding:22px 20px 20px;background:linear-gradient(160deg,#242c6b,#121738 70%);border:1px solid var(--line)}
.hero h1{font-size:24px;max-width:70%}
.hero p{color:var(--mut);margin-top:8px;max-width:68%;font-size:14px}
.hero svg{position:absolute;right:10px;bottom:0;width:46%;height:100%;opacity:.95}
.stats{display:flex;gap:10px;margin-top:16px}
.stat{background:#ffffff0d;border-radius:14px;padding:8px 12px;font-size:12px;color:var(--mut)}
.stat b{display:block;font:700 16px Unbounded,sans-serif;color:var(--tx)}
.pro-box{margin-top:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:16px;background:#f5b94a1a;border:1px solid #f5b94a55;font-size:13px}
.pro-box button{white-space:nowrap}
button{font:600 14px Onest,sans-serif;border:0;border-radius:12px;padding:10px 16px;cursor:pointer;background:var(--gold);color:#241a00}
button.ghost{background:var(--bg2);color:var(--tx);border:1px solid var(--line)}
button.danger{background:#ff5d7a22;color:var(--red)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.chips{display:flex;gap:8px;margin:20px 0 12px}
.chip{background:var(--bg2);color:var(--mut);border:1px solid var(--line);padding:8px 14px;border-radius:99px}
.chip.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.lesson{display:flex;gap:12px;padding:10px;margin-bottom:10px;border-radius:18px;background:var(--bg2);border:1px solid var(--line);cursor:pointer;text-align:left;width:100%;color:var(--tx)}
.thumb{flex:0 0 96px;height:78px;border-radius:12px;display:grid;place-items:center;position:relative}
.thumb svg{width:30px;height:30px}
.lesson h3{font-size:13px;margin:2px 0 4px}
.lesson p{color:var(--mut);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:12px;color:var(--mut)}
.tag{font-weight:600;font-size:11px;padding:2px 8px;border-radius:99px}
.tag.free{background:#3ddbb026;color:var(--mint)}
.tag.pro{background:#f5b94a26;color:var(--gold)}
.post{padding:16px;margin-bottom:12px;border-radius:18px;background:var(--bg2);border-left:4px solid var(--mint)}
.post h3{font-size:14px;margin-bottom:6px}
.post p{color:#c9cdf0;white-space:pre-wrap}
.post small{display:block;margin-top:8px;color:var(--mut)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,var(--bg) 40%)}
nav div{display:flex;gap:4px;padding:5px;border-radius:20px;background:#1d2350;border:1px solid var(--line);width:100%;max-width:488px}
nav button{flex:1;background:none;color:var(--mut);padding:11px 4px;font-size:13px}
nav button.on{background:var(--tx);color:var(--bg)}
.empty{padding:36px 16px;text-align:center;color:var(--mut);border:1px dashed var(--line);border-radius:18px}
label{display:block;font-size:12.5px;color:var(--mut);margin:12px 0 4px}
input,textarea,select{width:100%;font:15px Onest,sans-serif;color:var(--tx);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
textarea{min-height:80px;resize:vertical}
.card{padding:16px;border-radius:18px;background:var(--bg2);border:1px solid var(--line);margin-bottom:14px}
.card h2{font-size:15px;margin-bottom:4px}
.row{display:flex;gap:10px}.row>*{flex:1}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.modal{position:fixed;inset:0;background:#070a1bee;display:none;align-items:flex-end;justify-content:center;z-index:9}
.modal.open{display:flex}
.sheet{width:100%;max-width:520px;max-height:92%;overflow:auto;background:var(--bg2);border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));border:1px solid var(--line);animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
video{width:100%;border-radius:14px;background:#000;aspect-ratio:16/9}
.lock{aspect-ratio:16/9;border-radius:14px;display:grid;place-items:center;text-align:center;background:#f5b94a14;border:1px dashed #f5b94a77;padding:16px;color:var(--gold)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:20;display:none}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<section class="hero">
  <h1 id="hi">Trading Academy</h1>
  <p>Noldan professional darajagacha video darslar.</p>
  <svg viewBox="0 0 160 150" aria-hidden="true">
    <g stroke-width="3" stroke-linecap="round">
      <g stroke="#3ddbb0"><line x1="20" y1="100" x2="20" y2="140"/><line x1="70" y1="60" x2="70" y2="105"/><line x1="120" y1="20" x2="120" y2="70"/></g>
      <g stroke="#ff5d7a"><line x1="45" y1="80" x2="45" y2="130"/><line x1="95" y1="45" x2="95" y2="95"/><line x1="145" y1="35" x2="145" y2="80"/></g>
    </g>
    <rect x="14" y="108" width="12" height="26" rx="3" fill="#3ddbb0"/><rect x="39" y="92" width="12" height="30" rx="3" fill="#ff5d7a"/>
    <rect x="64" y="70" width="12" height="28" rx="3" fill="#3ddbb0"/><rect x="89" y="56" width="12" height="30" rx="3" fill="#ff5d7a"/>
    <rect x="114" y="30" width="12" height="32" rx="3" fill="#3ddbb0"/><rect x="139" y="44" width="12" height="28" rx="3" fill="#ff5d7a"/>
  </svg>
  <div class="stats"><div class="stat"><b id="nAll">0</b>dars</div><div class="stat"><b id="nFree">0</b>bepul</div><div class="stat"><b id="nPro" style="color:var(--gold)">0</b>PRO</div></div>
</section>

<main id="view"></main>

<nav><div>
  <button data-t="lessons" class="on">Darslar</button>
  <button data-t="info">Ma’lumot</button>
  <button data-t="admin">Admin</button>
</div></nav>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const ADMIN_PIN="1234"; // haqiqiy loyihada serverda tekshiriladi
const SEED={lessons:[
 {id:1,title:"Trading nima? Boshlang’ich tushunchalar",desc:"Bozor qanday ishlaydi, kim kimga sotadi va birinchi qadamlar.",url:"",dur:"12:40",pro:false},
 {id:2,title:"Shamchalar (candlestick) o‘qish",desc:"Yapon shamchalari, asosiy shakllar va ularning ma’nosi.",url:"",dur:"18:05",pro:false},
 {id:3,title:"Qo‘llab-quvvatlash va qarshilik darajalari",desc:"Support va resistance zonalarini grafikda to‘g‘ri belgilash.",url:"",dur:"22:30",pro:true},
 {id:4,title:"Risk menejment va lot hisoblash",desc:"Depozitni saqlash: stop-loss, take-profit va lot hajmi formulasi.",url:"",dur:"26:15",pro:true}],
 posts:[{id:1,title:"Xush kelibsiz!",text:"Bu yerda yangi darslar, signal qoidalari va e’lonlar joylanadi.",date:"13.11.2026"}],pro:false};
let S;try{S=JSON.parse(localStorage.getItem("ta"))||SEED}catch(e){S=SEED}
let tab="lessons",flt="all",isAdmin=false;
const save=()=>{try{localStorage.setItem("ta",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const toast=m=>{const t=$("#toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",1800)};
try{const u=window.Telegram&&Telegram.WebApp;if(u){u.ready();u.expand();const n=u.initDataUnsafe&&u.initDataUnsafe.user;if(n)$("#hi").textContent="Salom, "+n.first_name}}catch(e){}

const grads=["#4b5bff,#8a3dff","#12b8a0,#1b6fd1","#f5b94a,#ff6a3d","#ff5d7a,#8a3dff"];
const play='<svg viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg>';
const lockI='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg>';

function stats(){$("#nAll").textContent=S.lessons.length;$("#nFree").textContent=S.lessons.filter(l=>!l.pro).length;$("#nPro").textContent=S.lessons.filter(l=>l.pro).length}

function lessonsView(){
  const list=S.lessons.filter(l=>flt==="all"||(flt==="free"?!l.pro:l.pro));
  return `<div class="pro-box"><span>${S.pro?"PRO obunangiz faol. Barcha darslar ochiq.":"PRO darslar yopiq. Obuna bo‘lib hammasini oching."}</span>${S.pro?"":'<button id="buy">PRO olish</button>'}</div>
  <div class="chips">${[["all","Hammasi"],["free","Bepul"],["pro","PRO"]].map(([k,n])=>`<button class="chip ${flt===k?"on":""}" data-f="${k}">${n}</button>`).join("")}</div>
  ${list.length?list.map(l=>{const locked=l.pro&&!S.pro;return `<button class="lesson" data-id="${l.id}"><div class="thumb" style="background:linear-gradient(135deg,${grads[l.id%4]})">${locked?lockI:play}</div><div><h3>${esc(l.title)}</h3><p>${esc(l.desc)}</p><div class="meta"><span class="tag ${l.pro?"pro":"free"}">${l.pro?"PRO":"Bepul"}</span><span>${esc(l.dur||"")}</span></div></div></button>`}).join(""):'<div class="empty">Bu bo‘limda hali dars yo‘q.</div>'}`;
}
function infoView(){
  return S.posts.length?S.posts.map(p=>`<div class="post"><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p><small>${esc(p.date)}</small></div>`).join(""):'<div class="empty">Hozircha e’lon yo‘q.</div>';
}
function adminView(){
  if(!isAdmin)return `<div class="card"><h2>Admin kirish</h2><label>PIN kod</label><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><br><br><button id="login">Kirish</button></div>`;
  return `<div class="card"><h2>Yangi dars qo‘shish</h2>
  <label>Nomi</label><input id="lt">
  <label>Tavsif</label><textarea id="ld"></textarea>
  <label>Video havola (mp4 URL)</label><input id="lu" placeholder="https://...">
  <div class="row"><div><label>Davomiyligi</label><input id="ldur" placeholder="15:00"></div><div><label>Turi</label><select id="lp"><option value="0">Bepul</option><option value="1">PRO</option></select></div></div><br>
  <button id="addL">Dars qo‘shish</button></div>
  <div class="card"><h2>Ma’lumot e’loni</h2><label>Sarlavha</label><input id="pt"><label>Matn</label><textarea id="px"></textarea><br><br><button id="addP">E’lon joylash</button></div>
  <div class="card"><h2>Darslar</h2>${S.lessons.map(l=>`<div class="item"><span>${esc(l.title)} <span class="tag ${l.pro?"pro":"free"}">${l.pro?"PRO":"Bepul"}</span></span><button class="danger" data-dl="${l.id}">O‘chirish</button></div>`).join("")||"<p class='empty'>Dars yo‘q.</p>"}</div>
  <div class="card"><h2>E’lonlar</h2>${S.posts.map(p=>`<div class="item"><span>${esc(p.title)}</span><button class="danger" data-dp="${p.id}">O‘chirish</button></div>`).join("")||"<p class='empty'>E’lon yo‘q.</p>"}</div>
  <div class="card"><h2>Sinov rejimi</h2><p style="color:var(--mut);font-size:13px;margin-bottom:10px">PRO ochilganini ko‘rish uchun.</p><button class="ghost" id="tp">${S.pro?"PRO ni o‘chirish":"PRO ni yoqish"}</button> <button class="ghost" id="out">Chiqish</button></div>`;
}
function render(){stats();$("#view").innerHTML=tab==="lessons"?lessonsView():tab==="info"?infoView():adminView();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab))}

function openLesson(id){
  const l=S.lessons.find(x=>x.id==id);if(!l)return;const locked=l.pro&&!S.pro;
  $("#sheet").innerHTML=`${locked?`<div class="lock"><div>${lockI.replace('#fff','#f5b94a')}<p style="margin-top:8px"><b>Bu PRO dars</b><br>Ko‘rish uchun obuna bo‘ling.</p></div></div>`:
  (l.url?`<video src="${esc(l.url)}" controls playsinline></video>`:`<div class="lock" style="color:var(--mut)">Video hali yuklanmagan.</div>`)}
  <h2 style="font-size:16px;margin:14px 0 6px">${esc(l.title)}</h2><p style="color:#c9cdf0">${esc(l.desc)}</p><br><button class="ghost" id="close">Yopish</button>`;
  $("#modal").classList.add("open");$("#close").onclick=()=>$("#modal").classList.remove("open");
}
$("#modal").onclick=e=>{if(e.target.id==="modal")$("#modal").classList.remove("open")};

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.dataset.t){tab=t.dataset.t;render()}
  else if(t.dataset.f){flt=t.dataset.f;render()}
  else if(t.classList.contains("lesson"))openLesson(t.dataset.id);
  else if(t.id==="buy"){toast("To‘lov bot orqali amalga oshiriladi")}
  else if(t.id==="login"){if($("#pin").value===ADMIN_PIN){isAdmin=true;render()}else toast("PIN noto‘g‘ri")}
  else if(t.id==="out"){isAdmin=false;render()}
  else if(t.id==="tp"){S.pro=!S.pro;save();render()}
  else if(t.id==="addL"){const ti=$("#lt").value.trim();if(!ti)return toast("Dars nomini yozing");
    S.lessons.push({id:Date.now(),title:ti,desc:$("#ld").value.trim(),url:$("#lu").value.trim(),dur:$("#ldur").value.trim(),pro:$("#lp").value==="1"});save();render();toast("Dars qo‘shildi")}
  else if(t.id==="addP"){const ti=$("#pt").value.trim();if(!ti)return toast("Sarlavha yozing");
    S.posts.unshift({id:Date.now(),title:ti,text:$("#px").value.trim(),date:new Date().toLocaleDateString("ru-RU")});save();render();toast("E’lon joylandi")}
  else if(t.dataset.dl){S.lessons=S.lessons.filter(l=>l.id!=t.dataset.dl);save();render()}
  else if(t.dataset.dp){S.posts=S.posts.filter(p=>p.id!=t.dataset.dp);save();render()}
});
render();
</script>
</body>
</html>
